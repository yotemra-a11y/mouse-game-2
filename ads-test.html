<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <title>Ads Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 40px 20px;
      font-family: 'Press Start 2P', monospace;
    }

    h1 {
      color: #fdd94b;
      font-size: 10px;
      letter-spacing: 0.1em;
    }

    .ads-row {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      justify-content: center;
      align-items: flex-start;
    }

    .ad-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .ad-popup {
      image-rendering: pixelated;
      display: block;
      width: 180px;
      height: auto;
    }

    @keyframes ad-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .ad-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: #ff0000;
      -webkit-text-stroke: 1px #fff;
      animation: ad-blink 0.5s step-end infinite;
      white-space: nowrap;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>AD VARIANTS</h1>

  <div class="ads-row">
    <div class="ad-wrap">
      <img class="ad-popup" src="elements/adds/add 1 crop.png" alt="Ad 1" draggable="false">
      <span class="ad-label">ADD!!!</span>
    </div>
    <div class="ad-wrap">
      <img class="ad-popup" src="elements/adds/add 2 crop.png" alt="Ad 2" draggable="false">
      <span class="ad-label">ADD!!!</span>
    </div>
    <div class="ad-wrap">
      <img class="ad-popup" src="elements/adds/add 3 crop.png" alt="Ad 3" draggable="false">
      <span class="ad-label">ADD!!!</span>
    </div>
    <div class="ad-wrap">
      <img class="ad-popup" src="elements/adds/add 4 crop.png" alt="Ad 4" draggable="false">
      <span class="ad-label">ADD!!!</span>
    </div>
  </div>

</body>
</html>
